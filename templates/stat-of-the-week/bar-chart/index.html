<!DOCTYPE html>
<html lang="en" data-composition-variables='[{"id": "eyebrow", "type": "string", "label": "Eyebrow", "default": "Stat of the week"}, {"id": "prefix", "type": "string", "label": "Prefix, like $", "default": ""}, {"id": "value", "type": "number", "label": "The big number", "default": 4, "min": 0}, {"id": "decimals", "type": "number", "label": "Decimal places", "default": 0, "min": 0, "max": 2}, {"id": "suffix", "type": "string", "label": "Suffix, like x or %", "default": "x"}, {"id": "blurb", "type": "string", "label": "One-line explainer", "default": "Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod."}, {"id": "bar_labels", "type": "string", "label": "Bar labels, 3 to 5, separated by |", "default": "Lorem|Ipsum|Dolor|Amet"}, {"id": "bar_values", "type": "string", "label": "Bar sizes, same count, separated by |", "default": "25|45|68|100"}]'>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Brand fonts (swap in your own) */
      @font-face {
        font-family: "Hedvig Letters Serif";
        src: url("assets/fonts/hedvig.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-400.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-500.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-700.woff2") format("woff2");
        font-weight: 700;
      }

      /* Palette (swap in your own) */
      :root {
        --bg: #f7f6f2; /* soft white */
        --green: #1f514c; /* brand forest green */
        --green-hi: #2a675f; /* lit edge */
        --green-lo: #173f3b; /* shaded edge */
        --ink: #141414;
        --white: #ffffff;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: radial-gradient(120% 90% at 50% 35%, #fbfaf7 0%, var(--bg) 60%, #efede7 100%);
        font-family: "Inter", sans-serif;
      }
      #scene {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1600px;
      }

      /* Rounded card with soft 3D shading */
      #card {
        position: relative;
        width: 840px;
        height: 840px;
        transform-origin: 50% 60%;
      }
      /* green surface — separate from the text so it can expand to full frame on exit */
      #card-bg {
        position: absolute;
        inset: 0;
        border-radius: 56px;
        background: linear-gradient(150deg, var(--green-hi) 0%, var(--green) 45%, var(--green-lo) 100%);
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.18),
          inset 0 -6px 14px rgba(0, 0, 0, 0.22),
          0 2px 4px rgba(20, 20, 20, 0.08),
          0 18px 36px rgba(20, 20, 20, 0.14),
          0 48px 90px rgba(31, 81, 76, 0.22);
      }
      /* top-left sheen for depth */
      #card-sheen {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(80% 60% at 20% 0%, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0) 70%);
        pointer-events: none;
      }

      .card-content {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 72px 88px;
        gap: 24px;
        color: var(--white);
      }
      #eyebrow {
        display: block;
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      #stat {
        display: block;
        font-family: "Hedvig Letters Serif", serif;
        font-size: 200px;
        line-height: 0.92;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
      }
      #stat-pre,
      #stat-unit {
        font-size: 0.7em;
        margin-left: 0.03em;
      }
      #blurb {
        display: block;
        max-width: 664px;
        font-size: 34px;
        line-height: 1.3;
        font-weight: 400;
      }

      /* 4-column bar chart */
      #chart {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-top: 16px;
      }
      #bars {
        display: flex;
        align-items: flex-end;
        gap: 28px;
        height: 230px;
        border-bottom: 2px solid rgba(255, 255, 255, 0.35);
      }
      .bar {
        flex: 1;
        border-radius: 14px 14px 0 0;
        background: rgba(255, 255, 255, 0.32);
        transform-origin: 50% 100%;
      }
      .bar.is-hero {
        background: var(--white);
      }
      #labels {
        display: flex;
        gap: 28px;
      }
      .label {
        display: block;
        flex: 1;
        text-align: center;
        font-size: 24px;
        font-weight: 500;
        color: var(--white);
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-otst" id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1080">
      <div data-hf-id="hf-u6gg" id="scene" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <div data-hf-id="hf-55rf" id="card">
          <div data-hf-id="hf-wcp6" id="card-bg" data-layout-allow-overflow="true"><div data-hf-id="hf-j9cf" id="card-sheen"></div></div>
          <div data-hf-id="hf-3rv6" class="card-content">
            <span data-hf-id="hf-6usr" id="eyebrow" data-var-text="eyebrow">Stat of the week</span>
            <span data-hf-id="hf-gj88" id="stat"><span id="stat-pre"></span><span id="stat-num">0</span><span id="stat-unit">x</span></span>
            <span data-hf-id="hf-1qt2" id="blurb" data-var-text="blurb">Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do.</span>
            <div data-hf-id="hf-qxlv" id="chart">
              <div id="bars"></div>
              <div id="labels"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const vars = window.__hyperframes.getVariables();
      const STAT_TARGET = vars.value;
      const DECIMALS = vars.decimals;
      document.getElementById("stat-pre").textContent = vars.prefix;
      document.getElementById("stat-unit").textContent = vars.suffix;
      // Shrink the number's font so a long value still fits its box. The
      // widths are estimates (no font measuring), so they hold in every render.
      function fitStat(el, text) {
        const maxFont = parseFloat(getComputedStyle(el).fontSize);
        const maxWidth = el.clientWidth;
        const weight = [...text].reduce((w, c) => w + (/\d/.test(c) ? 1 : c === "," || c === "." ? 0.45 : 0.62), 0);
        el.style.fontSize = Math.min(maxFont, Math.floor(maxWidth / (weight * 0.6))) + "px";
      }
      function formatNumber(v, decimals) {
        return v.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
      }
      fitStat(document.getElementById("stat"), vars.prefix + formatNumber(STAT_TARGET, DECIMALS) + vars.suffix);

      // The bars: sizes are relative to the biggest, and the last bar is the hero.
      const labels = vars.bar_labels.split("|").map((t) => t.trim()).slice(0, 5);
      const sizes = vars.bar_values.split("|").map((t) => parseFloat(t)).slice(0, labels.length);
      const biggest = Math.max(...sizes);
      document.getElementById("bars").innerHTML = sizes
        .map((n, i) => `<div class="bar${i === sizes.length - 1 ? " is-hero" : ""}" style="height:${Math.max(6, (n / biggest) * 100)}%"></div>`)
        .join("");
      document.getElementById("labels").innerHTML = labels.map((t) => `<span class="label">${t.replace(/</g, "&lt;")}</span>`).join("");
      const tl = gsap.timeline({ paused: true });
      const numEl = document.getElementById("stat-num");
      const counter = { v: 0 };

      // Beat 1 (0–1s): card slides up into view, tilting flat as it lands
      tl.fromTo(
        "#card",
        { y: 1150, rotateX: 22, scale: 0.94 },
        { y: 0, rotateX: 0, scale: 1, duration: 0.95, ease: "power3.out" },
        0
      );

      // Beat 2 (1–3s): eyebrow → stat count-up → explainer
      tl.fromTo("#eyebrow", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.0);
      tl.fromTo("#stat", { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.55, ease: "power3.out" }, 1.2);
      tl.fromTo(
        counter,
        { v: 0 },
        {
          v: STAT_TARGET,
          duration: 1.3,
          ease: "power3.out",
          onUpdate: () => {
            numEl.textContent = formatNumber(counter.v, DECIMALS);
          },
        },
        1.2
      );
      // bars rise left to right, finishing with the count-up; labels follow each bar
      tl.fromTo(".bar", { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: "power3.out", stagger: 0.18 }, 1.35);
      tl.fromTo(".label", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.18 }, 1.5);
      tl.fromTo("#blurb", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.55, ease: "power2.out" }, 2.4);

      // Rest 3.0–6.0 on the full card, then exit:
      // 6.0–6.8 green surface expands to fill the frame (text stays put)
      tl.to("#card-bg", { scale: 1.3, borderRadius: 0, duration: 0.8, ease: "power3.inOut" }, 6.0);
      // 6.9–7.3 text fades in place
      tl.to(["#eyebrow", "#stat", "#blurb", "#chart"], { autoAlpha: 0, duration: 0.4, ease: "power1.in" }, 6.9);
      // 7.3–7.95 green fades to the soft white opening frame for a seamless loop
      tl.to("#card-bg", { autoAlpha: 0, duration: 0.65, ease: "power1.inOut" }, 7.3);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
